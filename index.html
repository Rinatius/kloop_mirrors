<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зеркало Клоопа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card mt-5">
                    <div class="card-body text-center">
                        <h1 class="card-title mb-4">Зеркало Клоопа</h1>
                        <p class="card-text mb-4">
                            Вставьте сюда адрес страницы с сайта kloop.kg или ky.kloop.asia и получите адрес зеркальной страницы
                        </p>
                        
                        <div class="mb-3">
                            <input type="url" 
                                   class="form-control" 
                                   id="urlInput" 
                                   placeholder="https://kloop.kg/blog/... или https://ky.kloop.asia/..."
                                   autocomplete="off">
                        </div>
                        
                        <button type="button" 
                                class="btn btn-primary mb-3" 
                                onclick="convertUrl()">
                            Получить зеркальную ссылку
                        </button>
                        
                        <div id="result" class="mt-3" style="display: none;">
                            <div class="alert alert-success">
                                <h6>Зеркальная ссылка:</h6>
                                <a id="mirrorLink" href="#" target="_blank" class="fw-bold"></a>
                                <div id="originalUrl" class="original-url-text mt-2"></div>
                            </div>
                        </div>
                        
                        <div id="error" class="mt-3" style="display: none;">
                            <div class="alert alert-danger">
                                <span id="errorMessage"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
