<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зеркало Клоопа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card mt-5">
                    <div class="card-body text-center">
                        <h1 class="card-title mb-4">Зеркало Клоопа</h1>
                        <p class="card-text mb-4">
                            Вставьте сюда адрес страницы с сайта kloop.kg или ky.kloop.asia и получите адрес зеркальной страницы
                        </p>
                        
                        <div class="mb-3">
                            <input type="url" 
                                   class="form-control" 
                                   id="urlInput" 
                                   placeholder="https://kloop.kg/blog/... или https://ky.kloop.asia/..."
                                   autocomplete="off">
                        </div>
                        
                        <button type="button" 
                                class="btn btn-primary mb-3" 
                                onclick="convertUrl()">
                            Получить зеркальную ссылку
                        </button>
                        
                        <div id="result" class="mt-3" style="display: none;">
                            <div class="alert alert-success">
                                <h6>Зеркальная ссылка:</h6>
                                <div class="d-flex align-items-center justify-content-between">
                                    <a id="mirrorLink" href="#" target="_blank" class="fw-bold flex-grow-1 me-2"></a>
                                    <button id="copyBtn" class="btn btn-outline-secondary btn-sm copy-btn" onclick="copyToClipboard()" title="Копировать">
                                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                            <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                                            <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                                        </svg>
                                    </button>
                                </div>
                                <div id="originalUrl" class="original-url-text mt-2"></div>
                            </div>
                        </div>
                        
                        <div id="error" class="mt-3" style="display: none;">
                            <div class="alert alert-danger">
                                <span id="errorMessage"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
